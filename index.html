```html
<!DOCTYPE html>
<html>
<head>
  <title>Auto Typer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      padding: 40px;
    }

    textarea {
      width: 80%;
      height: 150px;
      font-size: 18px;
      padding: 10px;
      margin: 10px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #4CAF50;
      color: white;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>

  <h1>⌨️ Auto Typer</h1>

  <p>Enter the text you want the computer to type:</p>

  <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>

  <br>

  <button onclick="startTyping()">▶ Start Auto Type</button>

  <h2>Typing Area</h2>

  <textarea id="typingArea" readonly></textarea>

  <script>
    function startTyping() {
      const text = document.getElementById("textInput").value;
      const typingArea = document.getElementById("typingArea");

      typingArea.value = "";

      let position = 0;

      function typeNextCharacter() {
        if (position < text.length) {
          typingArea.value += text[position];
          position++;

          setTimeout(typeNextCharacter, 50);
        }
      }

      typeNextCharacter();
    }
  </script>

</body>
</html>
```
